# Runs the Rust workspace's unit tests, on the toolchain pinned in containers/rust-utils/Dockerfile
name: Rust tests

permissions:
  contents: read

on:
  push:
    branches: ['master', 'dev', 'python-update']
  pull_request:

jobs:
  rust-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal && rustup default 1.97.1

      - name: Run tests
        run: cargo test --workspace --locked
