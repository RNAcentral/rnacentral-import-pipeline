name: Nextflow Lint

permissions:
  contents: read

on:
  push:
    branches: ['master', 'dev']
    paths: ['**.nf', '**.config', '.github/workflows/nextflow-lint.yaml']
  pull_request:
    paths: ['**.nf', '**.config', '.github/workflows/nextflow-lint.yaml']

jobs:
  lint:
    name: "nextflow lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      # weekly-update/ is excluded: update.config includes three files that do
      # not exist in the repo, so it cannot lint clean until that is sorted.
      - name: Lint workflows
        run: nextflow lint *.nf workflows/
