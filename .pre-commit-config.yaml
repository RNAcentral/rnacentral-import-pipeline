
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
-   repo: https://github.com/psf/black
    rev: 22.6.0
    hooks:
    -   id: black
-   repo: https://github.com/pycqa/isort
    rev: 5.11.5
    hooks:
    -   id: isort
        args: ["--profile", "black", "--filter-files"]
        name: isort (python)
-   repo: local
    hooks:
    -   id: rustfmt
        name: rustfmt
        entry: rustfmt
        language: system
        types: [rust]
        args: ['--edition', '2021']
    # Same scope and command as .github/workflows/nextflow-lint.yaml, so a
    # clean commit cannot fail lint in CI. weekly-update/ is excluded there.
    -   id: nextflow-lint
        name: nextflow lint
        # bash -c because pre-commit execs `entry` without a shell, so a bare
        # glob would be passed through to nextflow literally.
        entry: bash -c 'nextflow lint *.nf workflows/'
        language: system
        files: \.(nf|config)$
        pass_filenames: false
